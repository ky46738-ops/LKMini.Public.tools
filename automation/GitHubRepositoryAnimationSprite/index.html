<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>🎬 GitHub 倉庫製動畫精靈 v3.2</title>
  <style>
    :root{color-scheme:dark;--bg:#07141f;--panel:#10283e;--line:#315473;--text:#f4f9ff;--muted:#abc0d2;--ok:#95e6bd;--accent:#75d5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06131f,#0a2030);color:var(--text);font-family:system-ui,-apple-system,"PingFang TC",sans-serif}main{width:min(920px,100%);margin:auto;padding:24px 14px 80px}header,section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:.5rem 0}.ok{color:var(--ok);font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#142f49;border:1px solid var(--line);border-radius:14px;padding:14px}.card b{display:block;color:var(--accent);font-size:2rem}a{color:var(--accent);overflow-wrap:anywhere}code{overflow-wrap:anywhere}small,p{color:var(--muted)}
  </style>
</head>
<body>
<main>
  <header>
    <small>🥃錨點｜版本=v3.2｜狀態=完成</small>
    <h1>🎬 GitHub 倉庫製動畫精靈</h1>
    <p><code>LKMINI://automation/GitHubRepositoryAnimationSprite</code></p>
    <p id="state" class="ok">載入現行驗證資料</p>
  </header>
  <section class="grid" aria-label="驗證指標">
    <div class="card"><b id="root-count">1</b>正式根</div>
    <div class="card"><b id="container-count">1</b>正式容器</div>
    <div class="card"><b id="test-count">16/16</b>公開測試</div>
    <div class="card"><b id="error-count">0</b>現行錯誤</div>
  </section>
  <section>
    <h2>現行裁決</h2>
    <p>邏輯入口：🥳歡迎光臨</p>
    <p>網頁 Projection：<a id="projection" href="https://lkmini-wiring-hub.ky46738.chatgpt.site">Sites v22</a></p>
    <p>唯一寫回：<strong id="writeback">🧩LKMINI／🪞幻影膠囊</strong></p>
    <p>舊錯誤與舊版本保留於 Git 歷史；不再作為現行狀態。</p>
  </section>
</main>
<script src="./animation.js" defer></script>
</body>
</html>
