<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎬GitHub倉庫製動畫精靈｜GitHubRepositoryAnimationSprite</title><style>
:root{--b:#06131f;--p:#10283e;--c:#142f49;--l:#315473;--t:#f4f9ff;--m:#abc0d2;--a:#75d5ff;--x:#ff9797}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06131f,#0b2232);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}main{max-width:980px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(94px + env(safe-area-inset-bottom))}header,section{background:var(--p);border:1px solid var(--l);border-radius:19px;padding:14px;margin:9px 0}h1{font-size:24px}p,small{color:var(--m);overflow-wrap:anywhere}code{word-break:break-all}.bad{color:var(--x)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.metric,.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:11px}.metric b{display:block;color:var(--a);font-size:26px}.risk{background:#3a1d2a;border-color:#a94f57}.grid{display:grid;gap:7px}input{position:sticky;top:6px;z-index:3;width:100%;min-height:46px;background:#071a29;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:11px;font-size:16px}nav{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(96%,700px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:#06131ff2;border:1px solid var(--l);border-radius:18px}button{min-height:48px;border:0;border-radius:11px;background:var(--c);color:var(--m)}button.on{background:#27648b;color:white}[hidden]{display:none!important}@media(min-width:720px){.metrics{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main>
<header><small>🥃錨點｜版本=v1.5｜更新=2026-08-05 06:38 (Asia/Taipei)</small><h1>🎬 GitHub 倉庫製動畫精靈</h1><p id="state" class="bad"><b>錯誤</b>｜資料載入中</p></header>
<section class="metrics"><div class="metric"><b id="repo">23</b>Repository</div><div class="metric"><b id="branch">105</b>Branch</div><div class="metric"><b id="asset">31</b>素材</div><div class="metric"><b>0／0</b>Run／Job</div></section>
<input id="q" placeholder="搜尋 Repository、Commit、Path、Blob"><section id="v0" class="view"><div id="summary"></div></section><section id="v1" class="view" hidden><div id="repos" class="grid"></div></section><section id="v2" class="view" hidden><div id="assets" class="grid"></div></section><section id="v3" class="view" hidden><div id="steps" class="grid"></div></section><section id="v4" class="view" hidden><div id="errors" class="grid"></div></section></main>
<nav><button data-v="0">總覽</button><button data-v="1">倉庫</button><button data-v="2">素材</button><button data-v="3">十一動</button><button data-v="4">錯誤</button></nav><script src="animation.js"></script></body></html>
