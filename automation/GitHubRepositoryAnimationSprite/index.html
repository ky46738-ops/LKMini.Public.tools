<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f">
<title>🎬GitHub倉庫製動畫精靈｜GitHubRepositoryAnimationSprite</title>
<style>
:root{--bg:#07111f;--panel:#0f2036;--panel2:#152b47;--line:#294c70;--text:#eef6ff;--muted:#a8bdd2;--ok:#8ce0bd;--bad:#ffaaa8;--warn:#ffd27d;--accent:#78c7ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0,#12304e 0,#07111f 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;padding-bottom:calc(18px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(7,17,31,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}main{max-width:1060px;margin:auto;padding:12px}h1{font-size:21px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}code{word-break:break-all;color:#cbe9ff}.status{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 12px var(--bad)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.metric,.panel{background:rgba(15,32,54,.94);border:1px solid var(--line);border-radius:17px}.metric{padding:12px;text-align:center}.metric b{display:block;font-size:25px;color:var(--accent)}.metric small,.card small{color:var(--muted)}.panel{padding:14px;margin:10px 0}.filters{display:flex;gap:8px;overflow:auto}.filter,.card{appearance:none;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:13px;min-height:44px;padding:10px 13px;font:inherit}.filter{white-space:nowrap}.filter.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(120,199,255,.18)}.card{display:block;width:100%;text-align:left;margin:7px 0}.card b,.card small{display:block}.card small{margin-top:5px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}.asset{border-left:3px solid var(--accent);padding-left:10px;margin:10px 0}.timeline{display:flex;gap:7px;overflow:auto;padding:5px 0 9px}.node{min-width:118px;background:#10243d;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.node strong,.node span{display:block}.node span{font-size:12px;color:var(--muted)}#detail{min-height:110px;background:#09182a;border:1px dashed #315679;border-radius:14px;padding:13px}@media(max-width:680px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🎬 GitHub 倉庫製動畫精靈</h1><div class="status"><span class="dot"></span><b class="bad">錯誤</b><span>真實巡檢完成；證據缺口保留</span></div></header>
<main>
<section class="metrics"><div class="metric"><b id="repos">23</b><small>Repository</small></div><div class="metric"><b id="branches">105</b><small>Branch</small></div><div class="metric"><b id="commits">6</b><small>新 Commit</small></div><div class="metric"><b id="paths">3</b><small>新 Path</small></div><div class="metric"><b id="assetsN">9</b><small>素材</small></div><div class="metric"><b>0</b><small>Workflow Run</small></div></section>
<section class="panel"><div class="filters"><button class="filter active" data-f="all">全部</button><button class="filter" data-f="change">新變更</button><button class="filter" data-f="risk">錯誤</button><button class="filter" data-f="asset">素材</button><button class="filter" data-f="action">十一動</button></div></section>
<section class="panel item action"><h2>⚡ 十一動核心推進</h2><div class="grid" id="steps"></div></section>
<section class="panel item change"><h2>新變更</h2><div id="changes"></div></section>
<section class="panel item risk"><h2>錯誤證據</h2><div id="risks"></div></section>
<section class="panel item asset"><h2>可視化素材</h2><div id="assets"></div></section>
<section class="panel"><h2>Repository → A=A</h2><div class="timeline" id="timeline"></div><div id="detail"><b>點擊卡片查看完整證據。</b></div></section>
</main>
<script>
const fallback={metrics:{repositories:23,branches:105,new_commits:6,changed_files:3,visual_assets:9},new_commits:[],risks:[],visual_assets:[],eleven_actions:[]};
async function boot(){let d=fallback;try{d=await fetch('./animation-data.json',{cache:'no-store'}).then(r=>r.json())}catch(e){};repos.textContent=d.metrics.repositories;branches.textContent=d.metrics.branches;commits.textContent=d.metrics.new_commits;paths.textContent=d.metrics.changed_files;assetsN.textContent=d.metrics.visual_assets;(d.eleven_actions||[]).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<b>S${s.index} ${s.name}</b><small class="ok">${s.status}</small>`;steps.appendChild(b)});(d.new_commits||[]).forEach(c=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<b>${c.message}</b><small>${c.sha}<br>${c.summary}</small>`;b.onclick=()=>detail.innerHTML=`<h3>${c.message}</h3><p><code>${c.sha}</code></p><p>${c.summary}</p>`;changes.appendChild(b)});(d.risks||[]).forEach(r=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<b class="${r.level==='高'?'bad':'warn'}">${r.level}｜${r.title}</b><small>${r.evidence}</small>`;b.onclick=()=>detail.innerHTML=`<h3>${r.title}</h3><p><b>證據：</b>${r.evidence}</p><p><b>修復：</b>${r.repair}</p>`;risks.appendChild(b)});(d.visual_assets||[]).forEach(a=>{let x=document.createElement('div');x.className='asset';x.innerHTML=`<b>${a.type}｜${a.path}</b><small>${a.repository}<br>${a.use}</small>`;assets.appendChild(x)});'Repository → Commit → Tree → Path → Blob → Identity → Manifest → Locator → Snapshot → ReverseChain → 🥃老K系統 → 🧩LKMINI → A=A'.split(' → ').forEach(n=>{let x=document.createElement('div');x.className='node';x.innerHTML=`<strong>${n}</strong><span>回根節點</span>`;timeline.appendChild(x)})};boot();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');let f=b.dataset.f;document.querySelectorAll('.item').forEach(x=>x.style.display=f==='all'||x.classList.contains(f)?'block':'none')});
</script>
</body></html>
