    <rect x="260" y="238" width="160" height="132" rx="18" fill="#142f49" stroke="#315473"/><text x="340" y="300" fill="#75d5ff" font-size="46">107</text><text x="340" y="340" fill="#abc0d2" font-size="18">Branch</text>
    <rect x="436" y="238" width="160" height="132" rx="18" fill="#142f49" stroke="#315473"/><text x="516" y="300" fill="#75d5ff" font-size="46">3</text><text x="516" y="340" fill="#abc0d2" font-size="18">Workflow</text>
    <rect x="612" y="238" width="160" height="132" rx="18" fill="#142f49" stroke="#315473"/><text x="692" y="300" fill="#75d5ff" font-size="46">29</text><text x="692" y="340" fill="#abc0d2" font-size="18">視覺候選</text>
    <rect x="788" y="238" width="160" height="132" rx="18" fill="#142f49" stroke="#315473"/><text x="868" y="300" fill="#75d5ff" font-size="46">1</text><text x="868" y="340" fill="#abc0d2" font-size="18">正式根</text>
