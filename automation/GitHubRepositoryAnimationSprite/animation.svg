  <circle cx="1080" cy="80" r="260" fill="#153d57" opacity=".55"/>
  <rect x="48" y="48" width="1104" height="579" rx="28" fill="#10283e" stroke="#315473" stroke-width="2"/>
  <text x="84" y="112" fill="#95e6bd" font-size="22" font-family="system-ui,sans-serif">正版・無版本號</text>
